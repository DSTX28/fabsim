[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabsim"
version = "0.1.0"
description = "First-principles models of silicon front-end fabrication: oxidation, diffusion, implantation, sheet resistance and oxide colour"
authors = [{ name = "Daniel Shaheen" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools]
packages = ["fabsim"]
